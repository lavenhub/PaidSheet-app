name: Build Android APK & AAB

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android
        run: |
          if [ -d "android" ]; then
            echo "✅ Android platform already exists — running cap sync"
            npx cap sync android
          else
            echo "➕ Adding Android platform for the first time"
            npx cap add android
            npx cap sync android
          fi

      - name: Generate Icons (skip if sharp not available in CI)
        run: |
          if [ -f "scripts/generate-icons.js" ]; then
            node scripts/generate-icons.js || echo "Icon generation skipped"
          fi
        continue-on-error: true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
        working-directory: .

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Release AAB (unsigned)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
        continue-on-error: true

      # ── Sign the AAB for Play Store ──────────────────────────────────────────
      - name: Sign Release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: paidsheet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paidsheet-release-aab
          path: android/app/build/outputs/bundle/release/
          retention-days: 30

      # ── Auto-upload to Play Store on tagged release ───────────────────────────
      - name: Upload to Google Play (Internal Testing)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.paidsheet.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          changesNotSentForReview: true
